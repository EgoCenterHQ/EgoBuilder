# Locale
d-i debian-installer/locale string it_IT.UTF-8
d-i localechooser/supported-locales multiselect it_IT.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select it
d-i keyboard-configuration/layoutcode string it
d-i keyboard-configuration/variantcode string
d-i keyboard-configuration/modelcode string pc105
d-i console-setup/layoutcode string it
d-i console-setup/variantcode string
d-i console-setup/charmap47 select UTF-8

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string egocenter
# Do NOT use "local": it is the mDNS domain — it would end up in /etc/hosts as
# egocenter.local, triggering avahi's false conflict
d-i netcfg/get_domain string lan

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Clock: NTP during the install too (the TLS pulls of the 2nd boot need it)
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Rome
d-i clock-setup/ntp boolean true

# Partitioning (assumes 1 disk: with more disks d-i asks for the target)
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Root account
d-i passwd/root-login boolean true
d-i passwd/root-password password CHANGE_ME
d-i passwd/root-password-again password CHANGE_ME
d-i passwd/make-user boolean false

# Packages: everything is already in the live squashfs (sec. 4), which the
# installer in "live" mode copies to the target. No task, only updates.
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select full-upgrade

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Late command (runs in finish-install, the target is still mounted on /target)
# - network: ONLY systemd-networkd + resolved. d-i configures the
#   NIC with ifupdown: it is purged here, networkd takes over at the 1st boot
# - SSH host keys are regenerated at the 1st boot (egos-sshkeys)
# - Docker repo added to the installed system
d-i preseed/late_command string \
    in-target sh -c 'for p in ifupdown dhcpcd-base isc-dhcp-client network-manager; do dpkg -s $p >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get purge -y $p; done; true'; \
    rm -f /target/etc/network/interfaces; \
    in-target systemctl enable systemd-networkd systemd-resolved systemd-timesyncd systemd-time-wait-sync; \
    in-target systemctl enable avahi-daemon wsdd2 docker cockpit.socket; \
    in-target systemctl enable egos-sshkeys.service first-boot-setup.service docker-compose-startup.service egos-pool.service egos-pool-guard.service; \
    in-target sh -c 'systemctl enable ssh || systemctl enable ssh.socket || true'; \
    in-target systemctl disable hostapd dnsmasq; \
    in-target groupadd -f docker; \
    rm -f /target/etc/ssh/ssh_host_*; \
    cp /target/usr/local/share/egos/apt/*.list /target/etc/apt/sources.list.d/; \
    ln -sf /run/systemd/resolve/stub-resolv.conf /target/etc/resolv.conf

# Suppresses the final "Installation complete" prompt
d-i finish-install/reboot_in_progress note

# Shutdown after install (remove USB before the 1st boot)
d-i debian-installer/exit/poweroff boolean true
